<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Buku Kas — Catatan Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK, paling gampang buat GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper: #EDE6D6;
    --paper-card: #F7F2E7;
    --ink: #1F2A3C;
    --ink-soft: #5B6472;
    --hijau: #2F6B4F;
    --merah: #8B3A3A;
    --emas: #B98A2E;
    --garis: #D8CDB4;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(31,42,60,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }

  /* ===== Header / Kwitansi saldo ===== */
  .receipt{
    background:var(--ink);
    color:var(--paper-card);
    margin:0 0 18px 0;
    padding:22px 20px 26px;
    border-radius:0 0 18px 18px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .receipt::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-9px;
    height:18px;
    background-image: radial-gradient(circle at 9px 0, transparent 9px, var(--ink) 9.5px);
    background-size: 18px 18px;
    background-repeat: repeat-x;
  }
  .receipt-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.6;
    margin:0 0 6px;
  }
  .receipt-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 14px;
    opacity:.85;
  }
  .receipt-saldo-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    opacity:.65;
    margin-bottom:4px;
  }
  .receipt-saldo{
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(30px, 9vw, 42px);
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1.1;
  }
  .receipt-sub{
    display:flex;
    gap:22px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed rgba(247,242,231,0.25);
  }
  .receipt-sub-item{font-family:'IBM Plex Mono', monospace; font-size:13px;}
  .receipt-sub-item .lbl{display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; margin-bottom:2px;}
  .receipt-sub-item.masuk .val{color:#8FD9AE;}
  .receipt-sub-item.keluar .val{color:#E8A3A3;}

  /* ===== Container ===== */
  .wrap{ max-width:640px; margin:0 auto; padding:0 16px; }

  .tabs{
    display:flex;
    gap:8px;
    margin:4px 0 14px;
  }
  .tab{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--garis);
    background:var(--paper-card);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{ background:var(--ink); color:var(--paper-card); border-color:var(--ink); }

  /* ===== Ledger list ===== */
  .ledger-head{
    display:grid;
    grid-template-columns: 52px 1fr 90px 26px;
    gap:8px;
    padding:0 14px 8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .entry{
    background:var(--paper-card);
    border:1px solid var(--garis);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
    display:grid;
    grid-template-columns: 52px 1fr 90px 26px;
    gap:8px;
    align-items:center;
    box-shadow:var(--shadow);
  }
  .entry .tgl{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.25;
  }
  .entry .ket{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  .entry .jenis-tag{
    display:inline-block;
    margin-top:3px;
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    padding:1px 7px;
    border-radius:999px;
  }
  .jenis-tag.pemasukan{ background:#E3F1E8; color:var(--hijau); }
  .jenis-tag.pengeluaran{ background:#F3E4E4; color:var(--merah); }
  .entry .jml{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    text-align:right;
  }
  .entry .jml.pemasukan{ color:var(--hijau); }
  .entry .jml.pengeluaran{ color:var(--merah); }
  .entry .del{
    background:none;
    border:none;
    color:#B8AD94;
    font-size:17px;
    cursor:pointer;
    padding:2px;
    line-height:1;
  }
  .entry .del:hover{ color:var(--merah); }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-size:16px;
  }
  .empty small{
    display:block;
    margin-top:6px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    opacity:.75;
  }

  /* ===== FAB ===== */
  .fab{
    position:fixed;
    right:20px;
    bottom:22px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:var(--emas);
    color:#221703;
    border:none;
    font-size:28px;
    box-shadow:0 6px 18px rgba(185,138,46,0.45);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    transition:transform .15s ease;
  }
  .fab:active{ transform:scale(0.92); }

  /* ===== Bottom sheet ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(31,42,60,0.45);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:60;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--paper-card);
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform .25s cubic-bezier(.32,.72,0,1);
    z-index:70;
    max-width:640px;
    margin:0 auto;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px; border-radius:2px;
    background:var(--garis);
    margin:0 auto 16px;
  }
  .sheet h2{
    font-family:'Fraunces', serif;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .field input, .field textarea{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--garis);
    background:#fff;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus{
    outline:2px solid var(--emas);
    outline-offset:0;
  }
  .jenis-toggle{ display:flex; gap:8px; }
  .jenis-toggle button{
    flex:1;
    padding:11px 0;
    border-radius:10px;
    border:1.5px solid var(--garis);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .jenis-toggle button.active.masuk{ border-color:var(--hijau); background:#E3F1E8; color:var(--hijau); }
  .jenis-toggle button.active.keluar{ border-color:var(--merah); background:#F3E4E4; color:var(--merah); }
  .submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--ink);
    color:var(--paper-card);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:4px;
  }
  .submit-btn:disabled{ opacity:.5; }
  .err{ color:var(--merah); font-size:12.5px; margin-top:-6px; margin-bottom:12px; display:none; }

  .status-banner{
    max-width:640px; margin:0 auto 14px; padding:10px 16px;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    background:#F3E4E4; color:var(--merah);
    border-radius:10px;
  }

  @media (min-width:640px){
    .wrap{ padding:0 24px; }
  }
</style>
</head>
<body>

<div class="receipt">
  <div class="wrap" style="padding:0;">
    <p class="receipt-eyebrow">Buku Kas</p>
    <p class="receipt-title">Catatan Pemasukan &amp; Pengeluaran</p>
    <div class="receipt-saldo-label">Sisa Saldo</div>
    <div class="receipt-saldo" id="saldoTotal">Rp 0</div>
    <div class="receipt-sub">
      <div class="receipt-sub-item masuk">
        <span class="lbl">Pemasukan</span>
        <span class="val" id="totalMasuk">Rp 0</span>
      </div>
      <div class="receipt-sub-item keluar">
        <span class="lbl">Pengeluaran</span>
        <span class="val" id="totalKeluar">Rp 0</span>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="statusBanner" class="status-banner" style="display:none;"></div>

  <div class="tabs">
    <button class="tab active" data-filter="semua">Semua</button>
    <button class="tab" data-filter="pemasukan">Pemasukan</button>
    <button class="tab" data-filter="pengeluaran">Pengeluaran</button>
  </div>

  <div id="ledgerList"></div>
</div>

<button class="fab" id="fabAdd" aria-label="Tambah catatan">+</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h2>Tambah Catatan</h2>
  <form id="formEntry">
    <div class="field">
      <label for="fTanggal">Tanggal</label>
      <input type="date" id="fTanggal" required>
    </div>
    <div class="field">
      <label for="fKeterangan">Keterangan</label>
      <input type="text" id="fKeterangan" placeholder="mis. Jajan Angkringan, Uang Saku, Beli Komponen ESP32" required>
    </div>
    <div class="field">
      <label>Jenis</label>
      <div class="jenis-toggle">
        <button type="button" class="masuk active" data-jenis="pemasukan">Pemasukan</button>
        <button type="button" class="keluar" data-jenis="pengeluaran">Pengeluaran</button>
      </div>
    </div>
    <div class="field">
      <label for="fJumlah">Jumlah (Rp)</label>
      <input type="number" id="fJumlah" min="1" step="1" placeholder="0" required inputmode="numeric">
    </div>
    <p class="err" id="formErr">Isi dulu semua kolomnya ya.</p>
    <button type="submit" class="submit-btn" id="submitBtn">Simpan Catatan</button>
  </form>
</div>

<script>
/* =========================================================
   1) KONFIGURASI FIREBASE
   Ganti bagian di bawah ini pakai config project Firebase-mu
   (Firebase Console > Project Settings > Your apps > SDK setup)
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBiJnpWJWkDdSmprYtGMzfOOZHEU5a-Auo",
  authDomain: "catatan-3de9f.firebaseapp.com",
  projectId: "catatan-3de9f",
  storageBucket: "catatan-3de9f.firebasestorage.app",
  messagingSenderId: "30449631336",
  appId: "1:30449631336:web:83620bb4daa94ddca4bbdd",
  measurementId: "G-0V9FGKYTBH"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const kolTransaksi = db.collection("transaksi");

/* ========================================================= */

let currentFilter = "semua";
let currentJenis = "pemasukan";
let allEntries = [];

const rupiah = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");

const saldoEl = document.getElementById("saldoTotal");
const masukEl = document.getElementById("totalMasuk");
const keluarEl = document.getElementById("totalKeluar");
const listEl = document.getElementById("ledgerList");
const statusBanner = document.getElementById("statusBanner");

document.getElementById("fTanggal").valueAsDate = new Date();

// ---- Tabs filter ----
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

// ---- Bottom sheet open/close ----
const overlay = document.getElementById("overlay");
const sheet = document.getElementById("sheet");
const fab = document.getElementById("fabAdd");

function openSheet(){
  overlay.classList.add("show");
  sheet.classList.add("show");
}
function closeSheet(){
  overlay.classList.remove("show");
  sheet.classList.remove("show");
  document.getElementById("formErr").style.display = "none";
}
fab.addEventListener("click", openSheet);
overlay.addEventListener("click", closeSheet);

// ---- Jenis toggle di form ----
document.querySelectorAll(".jenis-toggle button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".jenis-toggle button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentJenis = btn.dataset.jenis;
  });
});

// ---- Submit form ----
document.getElementById("formEntry").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const tanggal = document.getElementById("fTanggal").value;
  const keterangan = document.getElementById("fKeterangan").value.trim();
  const jumlah = parseFloat(document.getElementById("fJumlah").value);
  const errEl = document.getElementById("formErr");

  if(!tanggal || !keterangan || !jumlah || jumlah <= 0){
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Menyimpan...";

  try{
    await kolTransaksi.add({
      tanggal,
      keterangan,
      jenis: currentJenis,
      jumlah,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById("formEntry").reset();
    document.getElementById("fTanggal").valueAsDate = new Date();
    currentJenis = "pemasukan";
    document.querySelectorAll(".jenis-toggle button").forEach(b=>b.classList.remove("active"));
    document.querySelector(".jenis-toggle button.masuk").classList.add("active");
    closeSheet();
  }catch(err){
    console.error(err);
    showStatus("Gagal menyimpan: " + err.message);
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = "Simpan Catatan";
  }
});

// ---- Hapus entry ----
async function hapusEntry(id){
  if(!confirm("Yakin mau hapus catatan ini?")) return;
  try{
    await kolTransaksi.doc(id).delete();
  }catch(err){
    console.error(err);
    showStatus("Gagal menghapus: " + err.message);
  }
}

function showStatus(msg){
  statusBanner.textContent = msg;
  statusBanner.style.display = "block";
}

function formatTanggalPendek(tglStr){
  const d = new Date(tglStr + "T00:00:00");
  const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return d.getDate() + " " + bulan[d.getMonth()] + "\n" + d.getFullYear();
}

// ---- Render list + saldo ----
function render(){
  let totalMasuk = 0, totalKeluar = 0;
  allEntries.forEach(e=>{
    if(e.jenis === "pemasukan") totalMasuk += e.jumlah;
    else totalKeluar += e.jumlah;
  });
  const saldo = totalMasuk - totalKeluar;

  saldoEl.textContent = rupiah(saldo);
  masukEl.textContent = rupiah(totalMasuk);
  keluarEl.textContent = rupiah(totalKeluar);

  const filtered = currentFilter === "semua"
    ? allEntries
    : allEntries.filter(e=>e.jenis === currentFilter);

  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">Belum ada catatan.<small>Tap tombol + di kanan bawah buat nambah pemasukan atau pengeluaran.</small></div>`;
    return;
  }

  listEl.innerHTML = filtered.map(e=>{
    const tanda = e.jenis === "pemasukan" ? "+" : "−";
    return `
      <div class="entry">
        <div class="tgl">${formatTanggalPendek(e.tanggal).split("\n").join("<br>")}</div>
        <div>
          <div class="ket">${escapeHtml(e.keterangan)}</div>
          <span class="jenis-tag ${e.jenis}">${e.jenis === "pemasukan" ? "Masuk" : "Keluar"}</span>
        </div>
        <div class="jml ${e.jenis}">${tanda} ${rupiah(e.jumlah).replace("Rp ","")}</div>
        <button class="del" onclick="hapusEntry('${e.id}')" aria-label="Hapus">✕</button>
      </div>
    `;
  }).join("");
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---- Listener real-time dari Firestore ----
kolTransaksi.orderBy("tanggal", "desc").onSnapshot((snapshot)=>{
  allEntries = snapshot.docs.map(doc=>({ id: doc.id, ...doc.data() }));
  statusBanner.style.display = "none";
  render();
}, (err)=>{
  console.error(err);
  showStatus("Gagal terhubung ke Firebase. Cek firebaseConfig atau koneksi internet.");
});
</script>
</body>
</html>
